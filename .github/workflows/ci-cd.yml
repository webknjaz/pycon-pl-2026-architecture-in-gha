---
# PHASE C caller: adds a second toxenv (`pre-commit`) so the coverage
# hook's `toxenv`-gated branch is exercised for real -- it fires for `py`
# (real coverage data exists) and correctly skips for `pre-commit` (no
# coverage data, gate is toxenv == 'py'). Phase D extends this same
# [py, pre-commit] dimension to a realistic multi-Python matrix -- nothing
# new is introduced there, just more legs of what's already here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        toxenv:
        - py
        - pre-commit
        xfail:
        - false
    uses: ./.github/workflows/reusable-tox.yml
    with:
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ubuntu-latest
      toxenv: ${{ matrix.toxenv }}
      timeout-minutes: '5'
      xfail: ${{ matrix.xfail }}
      tox-run-posargs: --cov-report=xml --junitxml=test-results.xml
      tox-rerun-posargs: --no-cov --lf -vvvvv
