---
# PHASE D caller: a realistic matrix (3 Python versions × 2 tox envs = 6
# legs) -- the caller owns 100% of this orchestration decision; the
# reusable workflow's code hasn't changed to support more legs, because it
# never needed to know how many there'd be. The `pre-commit` toxenv reuses
# this repo's own .pre-commit-config.yaml -- a real matrix dimension, not
# a purpose-built teaching env like `needs-jq` used to be.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        - '3.13'
        toxenv:
        - py
        - pre-commit
        xfail:
        - false
    uses: ./.github/workflows/reusable-tox.yml
    with:
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ubuntu-latest
      toxenv: ${{ matrix.toxenv }}
      timeout-minutes: '5'
      xfail: ${{ matrix.xfail }}
      tox-run-posargs: --cov-report=xml --junitxml=test-results.xml
      tox-rerun-posargs: --no-cov --lf -vvvvv

  # Branch protection's required-checks list breaks every time the matrix
  # above changes shape -- this job is the fix: one required check, always
  # correct, regardless of how many legs `tests:` has. `needs.tests.result`
  # already aggregates across every matrix leg automatically.
  check:  # This job does nothing and is only used for branch protection
    if: always()
    needs:
    - tests
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Decide whether the needed jobs succeeded or failed
      uses: re-actors/alls-green@release/v1
      with:
        jobs: ${{ toJSON(needs) }}
