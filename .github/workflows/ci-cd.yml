---
# PHASE B caller: same minimal matrix as Phase A, now also supplying the
# per-stage posargs the reusable workflow's three tox stages consume.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.11'
        - '3.12'
        toxenv:
        - py
        xfail:
        - false
    uses: ./.github/workflows/reusable-tox.yml
    with:
      python-version: ${{ matrix.python-version }}
      runner-vm-os: ubuntu-latest
      toxenv: ${{ matrix.toxenv }}
      timeout-minutes: '5'
      xfail: ${{ matrix.xfail }}
      tox-run-posargs: --cov-report=xml --junitxml=test-results.xml
      tox-rerun-posargs: --no-cov --lf -vvvvv
