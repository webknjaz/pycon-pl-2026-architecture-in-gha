---
# ANSWER-KEY-ONLY REVEAL (see ../../../../../../../../FACILITATOR-NOTES.md).
# Not something participants build hands-on -- this is the "here's how
# test/coverage reporting SHOULD be architected" reveal for Phase C.
#
# The real tox-dev/workflow bakes JUnit/Cobertura-summary and Codecov
# upload into unconditional CORE steps (see
# reference/reusable-tox-annotated.md) -- arguably inconsistent with
# Pattern 4's own "extend without modifying core" philosophy. This hook is
# the fix: the exact same information, produced entirely from a
# `post-tox-run` extension point, no core workflow changes, no external
# SaaS account (Codecov/Coveralls) required.
#
# Real precedent for hook-based reporting exists but is narrower: awx-plugins,
# awx_plugins.interfaces, and aio-libs/propcache all have a real
# `post-tox-job` hook uploading MyPy coverage to Coveralls. The clean
# `coverage report --format=markdown` one-liner below is real too (used in
# aio-libs/propcache) -- but there it lives in a hand-rolled `test:` job
# that doesn't call reusable-tox.yml at all. This hook is the synthesis:
# the real one-liner, wired into the real hook mechanism, tested here.

inputs:
  calling-job-context:
    description: A JSON string with the calling job's inputs
    type: string
  current-job-steps:
    description: A JSON string with this job's steps so far
    type: string
  job-dependencies-context:
    default: >-
      {}
    description: A JSON string with the calling workflow's `needs` context
    required: false
    type: string

runs:
  using: composite
  steps:
  - name: Append coverage results to the job summary
    if: >-
      !cancelled()
      && fromJSON(inputs.calling-job-context).toxenv == 'py'
    run: >-
      tox exec --skip-pkg-install --quiet -- coverage report --format=markdown
      >> "${GITHUB_STEP_SUMMARY}"
    shell: bash
