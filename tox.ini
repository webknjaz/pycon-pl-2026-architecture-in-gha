[tox]
envlist = py
isolated_build = true

[testenv]
package = editable
deps =
    pytest
    pytest-cov
commands =
    pytest {tty:--color=yes} {posargs:--cov-report=html:{envtmpdir}/htmlcov/}

[testenv:pre-commit]
skip_install = true
deps = pre-commit
pass_env =
    {[testenv]pass_env}
    SKIP
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:needs-jq]
# Phase C's hook exercise target: this env assumes `jq` is already on PATH.
# It has no other special powers -- the `post-src-checkout` hook is what's
# supposed to have installed `jq` before this env ever runs.
skip_install = true
allowlist_externals = jq
commands = jq --version
